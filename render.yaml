services:
  - type: web
    name: langchain-chatbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000 --workers 4
    envVars:
      - key: PORT
        value: 10000


 uvicorn main:app --reload  --host 0.0.0.0 -port 10000